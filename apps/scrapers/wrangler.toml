name = "shopify-leads-scrapers"
main = "src/index.ts"
account_id = "81cac75fe318d80f4344481afc4799ac"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Shared D1 — same database the web app reads from
[[d1_databases]]
binding = "LEADS_DB"
database_name = "shopify-leads"
database_id = "39f53b08-1ea9-4621-8704-e36b6b02ef27"

[observability]
enabled = true

# Crons removed on purpose (2026-08-21). The every-minute enrich pass kept
# running full-table scans against an empty queue and dominated the D1 bill.
# Scraping now runs in the Docker container (src/node/, deployed on Hetzner),
# which scrapes into local SQLite and syncs to D1 in batches.
# The Worker remains only for the manual HTTP endpoints below.
[triggers]
crons = []

# Manual trigger endpoints (also exposed for ad-hoc runs):
#   POST /enrich?limit=20
#   POST /judgeme?n=10
#   POST /import-storeleads  (body = JSON dump)
#   GET  /stats
